name: Collect Betual historical results
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-betual-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - name: Collect rendered Betual virtual results
        run: python collect_browser_results.py
      - name: Publish historical archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/matches.json data/browser_results_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Betual historical results archive"
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          else
            echo "No historical archive changes."
          fi
