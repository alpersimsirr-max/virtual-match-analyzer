name: Collect Betual results
on:
  workflow_dispatch:
    inputs:
      match_url:
        description: 'Optional live Betual match URL to inspect'
        required: false
        type: string
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: collect-betual-results
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - name: Inspect VBET API and collect archive
        run: python collector.py
      - name: Collect rendered Betual virtual results
        run: python collect_browser_results.py
      - name: Inspect supplied live match URL
        env:
          MATCH_URL: ${{ inputs.match_url || 'https://m.milyoner549.com/tr/sports/live/event-view/Soccer/Virtual%20Matches/18296755/betual-england-premier-league/31486770/chelsea-virtual-liverpool-virtual?s=2948.622314453125' }}
        run: python live_link_probe.py
      - name: Generate automatic virtual football forecasts
        run: python predict_live.py
      - name: Publish API research and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in collect_browser_results.py predictor.py predict_live.py PREDICTOR.md; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if [ -d data ]; then
            git add -A -- data/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Probe Betual sources and update archive"
            git push
          else
            echo "No generated files changed; nothing to publish."
          fi
