name: Collect Betual results
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: collect-betual-results
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Probe sources and collect archive
        run: python collector.py
      - name: Publish data and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/source_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Probe Betual sources and update archive"
            git push
          fi
