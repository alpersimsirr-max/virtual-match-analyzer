name: Collect Betual results
on:
  schedule:
    - cron: "* * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      match_url:
        description: 'Optional live Betual match URL to inspect'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: collect-betual-results
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - name: Inspect VBET API and collect archive
        run: python collector.py
      - name: Collect verified upcoming virtual football fixtures
        run: python collect_pre_match.py
      - name: Collect rendered Betual virtual results
        run: python collect_browser_results.py
      - name: Inspect supplied live match URL
        if: ${{ inputs.match_url != '' }}
        env:
          MATCH_URL: ${{ inputs.match_url }}
        run: python live_link_probe.py
      - name: Publish API research and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in collect_browser_results.py predictor.py predict_live.py PREDICTOR.md; do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done
          if [ -d data ]; then
            git add -A -- data/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Probe Betual sources and update archive"
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          else
            echo "No generated files changed; nothing to publish."
          fi
