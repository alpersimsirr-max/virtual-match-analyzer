name: Collect Betual results
on:
  workflow_dispatch:
    inputs:
      match_url:
        description: 'Optional live Betual match URL to inspect'
        required: false
        type: string
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: collect-betual-results
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - name: Inspect VBET API and collect archive
        run: python collector.py
      - name: Collect rendered Betual virtual results
        run: python collect_browser_results.py
      - name: Inspect supplied live match URL
        if: ${{ inputs.match_url != '' }}
        env:
          MATCH_URL: ${{ inputs.match_url }}
        run: python live_link_probe.py
      - name: Generate automatic virtual football forecasts
        run: python predict_live.py
      - name: Publish API research and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collect_browser_results.py predictor.py predict_live.py PREDICTOR.md data/live_predictions.json data/browser_results_probe.json data/matches.json data/source_probe.json data/virtual_discovery.json data/public_results_probe.json data/virtual_swarm_probe.json data/betual_competition_probe.json data/betual_event_id_probe.json data/betual_live_catalogue_probe.json data/betual_live_games.json data/betual_live_score_detail_probe.json data/manual_live_match.json data/live_link_probe.json data/api_research.json data/js_inspection/
          if ! git diff --cached --quiet; then
            git commit -m "Probe Betual sources and update archive"
            git push
          fi
